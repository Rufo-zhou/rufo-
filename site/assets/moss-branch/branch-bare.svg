<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Bare textured branch</title>
  <desc id="desc">A transparent organic branch layer with pale bark texture for the interactive moss homepage.</desc>
  <defs>
    <path id="branchPath" d="M-150 625C120 545 245 610 390 686C520 754 615 642 736 542C870 432 1007 470 1168 374C1308 291 1450 286 1750 196"/>
    <linearGradient id="barkBase" x1="0" x2="1" y1="0.65" y2="0.2">
      <stop offset="0" stop-color="#1c1812"/>
      <stop offset="0.12" stop-color="#594331"/>
      <stop offset="0.34" stop-color="#d6d0bd"/>
      <stop offset="0.58" stop-color="#82745e"/>
      <stop offset="0.82" stop-color="#f0efe9"/>
      <stop offset="1" stop-color="#231b14"/>
    </linearGradient>
    <linearGradient id="edgeLight" x1="0" x2="1">
      <stop offset="0" stop-color="#fbfbf7" stop-opacity="0.25"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#56432f" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="branchRough" x="-12%" y="-28%" width="124%" height="158%">
      <feTurbulence baseFrequency="0.012 0.058" numOctaves="5" seed="14" type="fractalNoise"/>
      <feDisplacementMap in="SourceGraphic" scale="17" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="-10%" y="-20%" width="120%" height="145%">
      <feTurbulence baseFrequency="0.72" numOctaves="4" seed="31" type="fractalNoise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.22"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="branchClip">
      <use href="#branchPath" fill="none" stroke="#000" stroke-linecap="round" stroke-width="210"/>
    </clipPath>
  </defs>
  <g filter="url(#branchRough)">
    <use href="#branchPath" fill="none" stroke="#17130f" stroke-linecap="round" stroke-width="236" opacity="0.42"/>
    <use href="#branchPath" fill="none" stroke="url(#barkBase)" stroke-linecap="round" stroke-width="198"/>
    <use href="#branchPath" fill="none" stroke="url(#edgeLight)" stroke-linecap="round" stroke-width="128" opacity="0.55"/>
    <use href="#branchPath" fill="none" stroke="#22190f" stroke-linecap="round" stroke-width="54" opacity="0.24"/>
  </g>
  <g clip-path="url(#branchClip)" opacity="0.92">
    <rect x="-120" y="120" width="1880" height="720" filter="url(#grain)" opacity="0.86"/>
    <g fill="none" stroke-linecap="round" opacity="0.74">
      <path d="M-80 584C183 510 315 580 420 640C565 724 635 606 765 510C902 409 1012 444 1162 360C1310 278 1458 282 1680 213" stroke="#312214" stroke-width="12"/>
