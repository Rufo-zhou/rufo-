      <path d="M62 548C255 526 368 628 514 610C664 590 731 456 889 450C1028 444 1105 365 1240 330" stroke="#6b5a43" stroke-width="16" opacity="0.5"/>
      <path d="M155 684C314 644 448 745 584 642C746 520 811 526 958 500C1115 474 1210 340 1455 282" stroke="#ffffff" stroke-width="6" opacity="0.42"/>
      <path d="M-6 598C210 548 362 615 500 676" stroke="#21170f" stroke-width="20" opacity="0.3"/>
      <path d="M770 492C912 392 1029 460 1168 370C1316 274 1452 286 1700 198" stroke="#20170f" stroke-width="19" opacity="0.28"/>
    </g>
    <g fill="#f3f1e8" opacity="0.74">
      <ellipse cx="170" cy="588" rx="64" ry="16" transform="rotate(12 170 588)"/>
      <ellipse cx="302" cy="640" rx="74" ry="18" transform="rotate(28 302 640)"/>
      <ellipse cx="502" cy="665" rx="88" ry="18" transform="rotate(-12 502 665)"/>
      <ellipse cx="720" cy="530" rx="82" ry="17" transform="rotate(-35 720 530)"/>
      <ellipse cx="942" cy="452" rx="94" ry="16" transform="rotate(9 942 452)"/>
      <ellipse cx="1162" cy="376" rx="82" ry="15" transform="rotate(-24 1162 376)"/>
      <ellipse cx="1394" cy="284" rx="96" ry="17" transform="rotate(-9 1394 284)"/>
    </g>
    <g fill="#3d2d1e" opacity="0.5">
      <ellipse cx="238" cy="650" rx="50" ry="13" transform="rotate(24 238 650)"/>
      <ellipse cx="606" cy="606" rx="64" ry="15" transform="rotate(-31 606 606)"/>
