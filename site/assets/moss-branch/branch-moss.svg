<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Moss covered branch</title>
  <desc id="desc">A transparent branch layer with fresh moss growth for mouse reveal interaction.</desc>
  <defs>
    <path id="branchPath" d="M-150 625C120 545 245 610 390 686C520 754 615 642 736 542C870 432 1007 470 1168 374C1308 291 1450 286 1750 196"/>
    <linearGradient id="barkBase" x1="0" x2="1" y1="0.66" y2="0.2">
