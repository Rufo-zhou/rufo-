      <stop offset="0.22" stop-color="#76624a"/>
      <stop offset="0.48" stop-color="#d4d0bd"/>
      <stop offset="0.74" stop-color="#6b604f"/>
      <stop offset="1" stop-color="#efece0"/>
    </linearGradient>
    <linearGradient id="moss" x1="0" x2="1">
      <stop offset="0" stop-color="#334000"/>
      <stop offset="0.28" stop-color="#6c7e07"/>
      <stop offset="0.56" stop-color="#9fb019"/>
      <stop offset="0.82" stop-color="#3f5604"/>
      <stop offset="1" stop-color="#c7cf44"/>
    </linearGradient>
    <filter id="branchRough" x="-12%" y="-28%" width="124%" height="158%">
      <feTurbulence baseFrequency="0.013 0.06" numOctaves="5" seed="21" type="fractalNoise"/>
      <feDisplacementMap in="SourceGraphic" scale="18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="mossRough" x="-14%" y="-28%" width="128%" height="160%">
