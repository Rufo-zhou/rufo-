<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dense moss growth</title>
  <desc id="desc">A transparent dense moss layer used as the brightest reveal layer on the homepage branch.</desc>
  <defs>
    <path id="branchPath" d="M-150 625C120 545 245 610 390 686C520 754 615 642 736 542C870 432 1007 470 1168 374C1308 291 1450 286 1750 196"/>
    <linearGradient id="mossBright" x1="0" x2="1">
      <stop offset="0" stop-color="#4b6500"/>
      <stop offset="0.28" stop-color="#94a90f"/>
      <stop offset="0.58" stop-color="#d0dc3f"/>
      <stop offset="0.82" stop-color="#5a7600"/>
      <stop offset="1" stop-color="#e5ec76"/>
    </linearGradient>
    <filter id="growthRough" x="-18%" y="-34%" width="136%" height="176%">
      <feTurbulence baseFrequency="0.067 0.14" numOctaves="5" seed="63" type="fractalNoise"/>
      <feDisplacementMap in="SourceGraphic" scale="28" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="softShadow" x="-18%" y="-34%" width="136%" height="176%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1a2200" flood-opacity="0.22"/>
    </filter>
    <clipPath id="branchClip">
      <use href="#branchPath" fill="none" stroke="#000" stroke-linecap="round" stroke-width="230"/>
    </clipPath>
  </defs>
  <g clip-path="url(#branchClip)" filter="url(#softShadow)">
