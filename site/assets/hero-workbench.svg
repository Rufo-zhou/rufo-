      <rect x="72" y="17" width="84" height="61" rx="8" fill="#0b0d0b" opacity="0.85"/>
      <rect x="198" y="17" width="84" height="61" rx="8" fill="#0b0d0b" opacity="0.85"/>
      <path d="M77 46h70M205 47h66" stroke="#6fd4cb" stroke-width="4" opacity="0.34"/>
    </g>
