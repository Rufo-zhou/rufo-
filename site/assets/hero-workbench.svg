<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Rufo AI video workflow workbench</title>
  <desc id="desc">A premium cinematic creative desk with screenplay pages, storyboard panels, a lens, film strips, and a glass AI production tablet.</desc>
  <defs>
    <radialGradient id="tableGlow" cx="48%" cy="45%" r="72%">
      <stop offset="0" stop-color="#263731"/>
      <stop offset="0.45" stop-color="#111716"/>
      <stop offset="1" stop-color="#050607"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx="40%" cy="42%" r="58%">
      <stop offset="0" stop-color="#83fff0" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#58cec5" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#58cec5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lensGlass" cx="48%" cy="44%" r="54%">
      <stop offset="0" stop-color="#e7fbff"/>
      <stop offset="0.16" stop-color="#82c7d9"/>
      <stop offset="0.34" stop-color="#23445a"/>
      <stop offset="0.62" stop-color="#10161e"/>
      <stop offset="1" stop-color="#020204"/>
    </radialGradient>
    <linearGradient id="pagePaper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="0.52" stop-color="#efe7d4"/>
      <stop offset="1" stop-color="#c9bd9d"/>
    </linearGradient>
    <linearGradient id="tabletGlass" x1="0.08" x2="0.92" y1="0" y2="1">
      <stop offset="0" stop-color="#f4f1e8" stop-opacity="0.36"/>
      <stop offset="0.28" stop-color="#6fd4cb" stop-opacity="0.12"/>
      <stop offset="0.62" stop-color="#111716" stop-opacity="0.64"/>
      <stop offset="1" stop-color="#020304" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" x2="1">
      <stop offset="0" stop-color="#f1d991" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#f6deb1" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#a86834" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="38" stdDeviation="34" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="noise">
      <feTurbulence baseFrequency="0.78" numOctaves="3" seed="19" type="fractalNoise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.055"/>
      </feComponentTransfer>
    </filter>
    <pattern id="filmHoles" width="54" height="54" patternUnits="userSpaceOnUse">
      <rect x="8" y="10" width="14" height="20" rx="3" fill="#f4f1e8" opacity="0.64"/>
      <rect x="32" y="10" width="14" height="20" rx="3" fill="#f4f1e8" opacity="0.64"/>
    </pattern>
    <pattern id="storyGrid" width="160" height="108" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="138" height="80" rx="10" fill="#f4f1e8" opacity="0.11"/>
      <path d="M18 22h52M18 40h88M18 58h70" stroke="#f4f1e8" stroke-width="3" opacity="0.16" stroke-linecap="round"/>
    </pattern>
  </defs>

  <rect width="1600" height="1100" fill="url(#tableGlow)"/>
